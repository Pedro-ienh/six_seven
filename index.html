<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Gatos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <h1>🐱 Catálogo de Gatos</h1>
  <p>Clique em qualquer card para ver detalhes</p>
</header>

<div class="controls">
  <button id="btn-pelo">🔴 Soltam pelo</button>
  <button id="btn-usa">🔵 Origem EUA</button>
  <div class="search-group">
    <input id="campo-busca" type="text" placeholder="Buscar raça, origem ou temperamento…" />
    <button id="btn-filtrar">🟣 Filtrar</button>
  </div>
  <button id="btn-limpar">✕ Limpar</button>
  <button id="btn-console">🖥️ Exercícios 7–10 no console</button>
</div>

<div id="gatos"></div>
<p class="hint">Abra o DevTools (F12) e veja o console para os exercícios 7–10</p>

<script src="script.js"></script>
</body>
</html>
